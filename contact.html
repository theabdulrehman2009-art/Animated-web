<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Abdul Rehman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="wrap block split">
<div>
<p class="role">Contact</p>
<h1>Tell me about your project.</h1>
<p class="lead">I reply within two working days. A few lines on your goals and timeline is enough to get started.</p>
<dl class="info"><dt>Email</dt><dd id="mailLine"></dd><dt>Phone</dt><dd id="phoneLine"></dd><dt>Availability</dt><dd>Open to freelance projects and full-time roles</dd></dl>
</div>
<form id="contactForm" novalidate>
<label>Your name<input name="name" required autocomplete="name"></label>
<label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Message<textarea name="message" rows="5" required></textarea></label>
<p class="msg" id="formMsg" role="status"></p>
<button class="btn primary" type="submit">Send message</button>
</form>
</section>
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
</body>
</html>
